name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # elan reads `lean-toolchain` and installs the pinned toolchain on the
      # first `lake` call; nothing else is needed, the module imports only
      # `Lean`.
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Builds the library and both example files; Negative.lean is
      # `#guard_msgs`-checked, so a changed message fails here.
      - run: lake build
